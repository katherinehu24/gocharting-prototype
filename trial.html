<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GoCharting — Trial Activation (Redesigned)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root {
  /* Surfaces */
  --gc-bg-page: #0B0716;
  --gc-bg-alt: #110B1F;
  --gc-bg-card: #181029;
  --gc-bg-card-dim: #120B20;
  --gc-bg-raised: #1D152E;
  --gc-bg-input: #110B1F;
  --gc-bg-hover: #271A40;
  --gc-bg-ink: #280858;
  --gc-bg-nav: #181B38;

  /* Borders */
  --gc-border: #2A1F44;
  --gc-border-strong: #3D2D5E;
  --gc-border-subtle: #1E1632;

  /* Text */
  --gc-text-primary: #ECE6F5;
  --gc-text-secondary: #9A8FB3;
  --gc-text-tertiary: #8B7FA6;
  --gc-text-inverse: #FFFFFF;

  /* Brand violet */
  --gc-accent: #763DFD;
  --gc-accent-bright: #8C5CFE;
  --gc-accent-hover: #8B5BFF;
  --gc-accent-active: #5C28D9;
  --gc-accent-soft: rgba(118, 61, 253, 0.14);
  --gc-accent-glow: rgba(140, 92, 254, 0.45);
  --gc-accent-bg-radial: rgba(118, 61, 253, 0.08);
  --gc-accent-shadow: rgba(118, 61, 253, 0.35);
  --gc-bear-tint: rgba(239, 83, 80, 0.1);

  /* US flag (decorative, accuracy-scoped — not brand colors) */

  /* Brand teal */
  --gc-teal: #03BA98;
  --gc-teal-bright: #06D2AB;
  --gc-teal-deep: #129B8C;
  --gc-teal-eyebrow: #22998F;
  --gc-teal-soft: rgba(3, 186, 152, 0.16);
  --gc-teal-tint: rgba(3, 186, 152, 0.06);
  --gc-teal-bg-radial: rgba(3, 186, 152, 0.05);
  --gc-teal-pulse-start: rgba(3, 186, 152, 0.3);
  --gc-teal-pulse-end: rgba(3, 186, 152, 0);

  /* Brand amber */
  --gc-amber: #F4AB1A;
  --gc-amber-deep: #D8920A;
  --gc-amber-soft: rgba(244, 171, 26, 0.16);

  /* Upgrade gradient */
  --gc-gradient-upgrade: linear-gradient(90deg, var(--gc-teal) 0%, var(--gc-accent) 100%);
  --gc-gradient-upgrade-bright: linear-gradient(90deg, var(--gc-teal-bright) 0%, var(--gc-accent-bright) 100%);

  /* Status */
  --gc-bull: #03BA98;
  --gc-bear: #EF5350;
  --gc-warn: #F4AB1A;

  /* Spacing */
  --gc-s-1: 4px;
  --gc-s-2: 8px;
  --gc-s-3: 12px;
  --gc-s-4: 16px;
  --gc-s-5: 24px;
  --gc-s-6: 32px;
  --gc-s-7: 48px;
  --gc-s-8: 64px;
  --gc-s-9: 96px;

  /* Radii */
  --gc-radius-sm: 6px;
  --gc-radius-md: 10px;
  --gc-radius-lg: 16px;
  --gc-radius-xl: 20px;
  --gc-radius-pill: 999px;

  /* Shadows */
  --gc-shadow-pop: 0 4px 16px rgba(0, 0, 0, 0.4);
  --gc-shadow-modal: 0 16px 48px rgba(0, 0, 0, 0.6);
  --gc-shadow-glow: 0 0 32px rgba(118, 61, 253, 0.35);

  /* Motion */
  --gc-ease: cubic-bezier(0.2, 0, 0, 1);
  --gc-dur-fast: 120ms;
  --gc-dur-base: 200ms;
  --gc-dur-slow: 320ms;

  /* Fonts */
  --gc-font-sans: 'Inter', -apple-system, 'SF Pro Text', system-ui, sans-serif;
  --gc-font-mono: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--gc-bg-page);
  color: var(--gc-text-primary);
  font-family: var(--gc-font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Subtle radial bg accent */
body {
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, var(--gc-accent-bg-radial), transparent 50%),
    radial-gradient(ellipse 60% 40% at 90% 10%, var(--gc-teal-bg-radial), transparent 50%),
    var(--gc-bg-page);
  min-height: 100vh;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
button:disabled { cursor: not-allowed; }
input { font-family: inherit; }

a { color: var(--gc-accent-bright); text-decoration: none; }
a:hover { color: var(--gc-accent-hover); text-decoration: underline; }

.gc-mono { font-family: var(--gc-font-mono); font-variant-numeric: tabular-nums; }

.gc-eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gc-teal-eyebrow);
}
.gc-eyebrow-amber {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gc-amber);
}

/* Top nav */
.gc-topnav {
  background: var(--gc-bg-nav);
  border-bottom: 1px solid var(--gc-border);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.gc-logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 700; color: var(--gc-text-primary);
  letter-spacing: -0.01em;
  text-decoration: none;
  transition: opacity var(--gc-dur-fast) var(--gc-ease);
}
.gc-logo:hover { opacity: 0.85; text-decoration: none; color: var(--gc-text-primary); }
.gc-logo-mark {
  width: 28px; height: 28px;
  background: var(--gc-gradient-upgrade);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: white;
  font-family: var(--gc-font-mono);
}
.gc-topnav-right {
  display: flex; align-items: center; gap: 16px;
  font-size: 13px; color: var(--gc-text-secondary);
}
.gc-help-link {
  font-size: 13px;
  color: var(--gc-text-secondary);
  font-weight: 500;
}
.gc-help-link:hover { color: var(--gc-text-primary); text-decoration: none; }

/* Layout */
.gc-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px;
}
.gc-grid {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 32px;
  align-items: start;
}
@media (max-width: 1023px) {
  .gc-grid { grid-template-columns: 1fr; }
}

/* Order summary panel */
.gc-summary {
  background: var(--gc-bg-card);
  border: 1px solid var(--gc-border);
  border-radius: var(--gc-radius-lg);
  padding: 24px;
  position: sticky;
  top: 32px;
  box-shadow: var(--gc-shadow-pop);
}
.gc-summary-eyebrow { margin-bottom: 8px; }
.gc-summary-name {
  font-size: 20px;
  font-weight: 600;
  color: var(--gc-text-primary);
  letter-spacing: -0.01em;
  margin-bottom: 16px;
}
.gc-summary-dynamic {
  animation: gcSummaryFade var(--gc-dur-base) var(--gc-ease);
}
@keyframes gcSummaryFade {
  from { opacity: 0.3; transform: translateY(2px); }
  to { opacity: 1; transform: translateY(0); }
}
.gc-summary-price-block {
  background: var(--gc-bg-card-dim);
  border: 1px solid var(--gc-border-subtle);
  border-radius: var(--gc-radius-md);
  padding: 16px;
  margin-bottom: 16px;
}
.gc-summary-trial-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--gc-teal);
  margin-bottom: 6px;
}
.gc-summary-price-big {
  font-family: var(--gc-font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 32px;
  font-weight: 600;
  color: var(--gc-teal);
  letter-spacing: -0.02em;
  line-height: 1;
  margin-bottom: 8px;
}
.gc-summary-renewal {
  font-family: var(--gc-font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  color: var(--gc-text-secondary);
}
.gc-renewal-disclosure {
  font-size: 11px;
  line-height: 1.55;
  color: var(--gc-text-secondary);
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--gc-border-subtle);
}
.gc-renewal-disclosure .gc-mono {
  color: var(--gc-text-primary);
  font-weight: 600;
}
.gc-divider {
  height: 1px;
  background: var(--gc-border-subtle);
  margin: 16px 0;
}
.gc-summary-section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--gc-text-tertiary);
  margin-bottom: 12px;
}
.gc-included-list { display: flex; flex-direction: column; gap: 10px; }
.gc-included-row {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 13px; color: var(--gc-text-secondary);
}
.gc-included-row svg { flex-shrink: 0; margin-top: 2px; }

.gc-trust-strip {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 12px;
  color: var(--gc-text-secondary);
}
.gc-trust-row { display: flex; align-items: center; gap: 8px; }
.gc-trust-row .gc-mono { color: var(--gc-text-primary); }

.gc-summary-footer-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 16px;
  font-size: 13px;
  color: var(--gc-accent-bright);
  font-weight: 500;
}

/* Step area */
.gc-step-area {
  min-height: 600px;
}

/* Timeline */
.gc-timeline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  padding: 0 12px;
}
.gc-timeline-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
  position: relative;
  z-index: 2;
}
.gc-timeline-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--gc-bg-card);
  border: 2px solid var(--gc-border-strong);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--gc-dur-base) var(--gc-ease);
}
.gc-timeline-dot.active {
  background: var(--gc-accent);
  border-color: var(--gc-accent);
  box-shadow: 0 0 0 4px var(--gc-accent-soft);
}
.gc-timeline-dot.complete {
  background: var(--gc-teal);
  border-color: var(--gc-teal);
}
.gc-timeline-dot.complete svg {
  width: 10px; height: 10px; color: white;
}
.gc-timeline-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--gc-text-tertiary);
  letter-spacing: 0.02em;
}
.gc-timeline-label.active { color: var(--gc-text-primary); font-weight: 600; }
.gc-timeline-label.complete { color: var(--gc-teal); }
.gc-timeline-line {
  flex: 1 1 auto;
  height: 2px;
  background: var(--gc-border-strong);
  margin: 0 -4px;
  margin-bottom: 20px;
  position: relative;
  z-index: 1;
  transition: background var(--gc-dur-base) var(--gc-ease);
}
.gc-timeline-line.complete { background: var(--gc-teal); }

/* Step content */
.gc-step-content {
  animation: gcFadeIn var(--gc-dur-slow) var(--gc-ease);
}
@keyframes gcFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.gc-step-header { margin-bottom: 24px; }
.gc-step-eyebrow { margin-bottom: 8px; }
.gc-step-h2 {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--gc-text-primary);
  margin-bottom: 8px;
  line-height: 1.15;
}
.gc-step-subtitle {
  font-size: 14px;
  color: var(--gc-text-secondary);
  line-height: 1.55;
}

/* Plan card */
.gc-plan-card {
  background: var(--gc-bg-card);
  border: 1px solid var(--gc-border);
  border-radius: var(--gc-radius-lg);
  padding: 24px;
  margin-bottom: 16px;
  transition: all var(--gc-dur-base) var(--gc-ease);
  cursor: pointer;
}
.gc-plan-card:hover {
  border-color: var(--gc-border-strong);
}
.gc-plan-card.selected {
  border-color: var(--gc-accent);
  box-shadow: var(--gc-shadow-glow);
}
.gc-plan-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.gc-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: var(--gc-radius-pill);
}
.gc-badge-amber {
  background: var(--gc-amber-soft);
  color: var(--gc-amber);
}
.gc-badge-teal {
  background: var(--gc-teal-soft);
  color: var(--gc-teal);
}

.gc-plan-name {
  font-size: 20px;
  font-weight: 600;
  color: var(--gc-text-primary);
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}
.gc-plan-desc {
  font-size: 13px;
  color: var(--gc-text-secondary);
  line-height: 1.55;
  margin-bottom: 16px;
}

/* Custom checkbox */
.gc-checkbox {
  width: 20px;
  height: 20px;
  border: 1.5px solid var(--gc-border-strong);
  border-radius: 4px;
  background: var(--gc-bg-input);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all var(--gc-dur-fast) var(--gc-ease);
  cursor: pointer;
}
.gc-checkbox.checked {
  background: var(--gc-teal);
  border-color: var(--gc-teal);
}
.gc-checkbox svg {
  width: 12px; height: 12px;
  color: white;
  opacity: 0;
  transition: opacity var(--gc-dur-fast) var(--gc-ease);
}
.gc-checkbox.checked svg { opacity: 1; }

/* Segmented toggle */
.gc-segmented {
  display: inline-flex;
  background: var(--gc-bg-input);
  border: 1px solid var(--gc-border);
  border-radius: var(--gc-radius-pill);
  padding: 4px;
  margin-bottom: 16px;
  gap: 2px;
  position: relative;
}
.gc-segment {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--gc-radius-pill);
  color: var(--gc-text-secondary);
  transition: all var(--gc-dur-fast) var(--gc-ease);
  white-space: nowrap;
  position: relative;
}
.gc-segment:hover { color: var(--gc-text-primary); }
.gc-segment.active {
  background: var(--gc-accent);
  color: white;
  font-weight: 600;
}
.gc-segmented.disabled { opacity: 0.4; pointer-events: none; }
.gc-segment:disabled { cursor: not-allowed; }
.gc-segment .gc-mono {
  font-size: 12px;
  margin-left: 4px;
}

.gc-feature-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.gc-feature-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--gc-text-primary);
}
.gc-feature-row svg { flex-shrink: 0; color: var(--gc-teal); }

/* Trust strip Step 1 */
.gc-trust-strip-horizontal {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 24px;
  padding: 16px 0;
  border-top: 1px solid var(--gc-border-subtle);
  margin: 24px 0;
}
.gc-trust-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--gc-text-secondary);
}
.gc-trust-item .gc-mono,
.gc-trust-item strong {
  color: var(--gc-teal);
  font-weight: 600;
}
.gc-stars { display: inline-flex; gap: 1px; }

/* Primary CTA */
.gc-cta-primary {
  width: 100%;
  padding: 16px 24px;
  border-radius: var(--gc-radius-pill);
  background: var(--gc-gradient-upgrade);
  color: var(--gc-text-inverse);
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all var(--gc-dur-fast) var(--gc-ease);
  letter-spacing: -0.005em;
}
.gc-cta-primary:hover:not(:disabled) {
  background: var(--gc-gradient-upgrade-bright);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px var(--gc-accent-shadow);
}
.gc-cta-primary:disabled {
  opacity: 0.4;
  filter: saturate(0.6);
}
.gc-cta-ghost {
  padding: 16px 24px;
  border-radius: var(--gc-radius-pill);
  background: transparent;
  border: 1px solid var(--gc-border);
  color: var(--gc-text-secondary);
  font-size: 15px;
  font-weight: 500;
  transition: all var(--gc-dur-fast) var(--gc-ease);
}
.gc-cta-ghost:hover {
  background: var(--gc-bg-hover);
  color: var(--gc-text-primary);
  border-color: var(--gc-border-strong);
}

/* "Why we collect" card */
.gc-why-card {
  background: var(--gc-teal-soft);
  border: 1px solid var(--gc-teal);
  border-radius: var(--gc-radius-md);
  padding: 16px;
  margin-bottom: 24px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.gc-why-card svg { flex-shrink: 0; color: var(--gc-teal); margin-top: 2px; }
.gc-why-card-text {
  font-size: 13px;
  color: var(--gc-text-primary);
  line-height: 1.55;
}
.gc-why-card-text strong { color: var(--gc-teal); font-weight: 600; }

/* Forms */
.gc-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.gc-form-grid-full { grid-column: 1 / -1; }
@media (max-width: 600px) { .gc-form-grid { grid-template-columns: 1fr; } }

.gc-field { display: flex; flex-direction: column; gap: 6px; }
.gc-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--gc-text-secondary);
  letter-spacing: 0.01em;
}
.gc-label .req { color: var(--gc-bear); margin-left: 2px; }
.gc-input {
  background: var(--gc-bg-input);
  border: 1px solid var(--gc-border);
  border-radius: var(--gc-radius-sm);
  padding: 12px 14px;
  font-size: 14px;
  color: var(--gc-text-primary);
  outline: none;
  width: 100%;
  transition: all var(--gc-dur-fast) var(--gc-ease);
}
.gc-input::placeholder { color: var(--gc-text-tertiary); }
.gc-input:focus {
  border-color: var(--gc-accent);
  box-shadow: 0 0 0 3px var(--gc-accent-glow);
}
.gc-input.error { border-color: var(--gc-bear); }
.gc-input-readonly {
  color: var(--gc-text-tertiary);
  cursor: not-allowed;
}
.gc-input-readonly:focus {
  border-color: var(--gc-border);
  box-shadow: none;
}
.gc-field-hint {
  font-size: 12px;
  color: var(--gc-text-tertiary);
  margin-top: 2px;
  line-height: 1.4;
}
.gc-input-error {
  font-size: 11px;
  color: var(--gc-bear);
}

/* Phone input with prefix */
.gc-phone-row {
  display: flex;
  gap: 8px;
}
.gc-phone-prefix {
  background: var(--gc-bg-input);
  border: 1px solid var(--gc-border);
  border-radius: var(--gc-radius-sm);
  padding: 12px 14px;
  font-size: 14px;
  color: var(--gc-text-primary);
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}

/* Section divider */
.gc-section-block {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--gc-border-subtle);
}

/* Acknowledgment checkbox row */
.gc-ack-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px;
  background: var(--gc-bg-card-dim);
  border: 1px solid var(--gc-border-subtle);
  border-radius: var(--gc-radius-md);
  margin-bottom: 12px;
  transition: all var(--gc-dur-fast) var(--gc-ease);
}
.gc-ack-row:hover { border-color: var(--gc-border); }
.gc-ack-row.checked {
  border-color: var(--gc-teal);
  background: var(--gc-teal-tint);
}
.gc-ack-label {
  font-size: 13px;
  color: var(--gc-text-primary);
  line-height: 1.5;
  cursor: pointer;
  flex: 1;
}
.gc-disclosure-toggle {
  font-size: 12px;
  color: var(--gc-text-secondary);
  background: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 6px;
  padding: 0;
}
.gc-disclosure-toggle:hover { color: var(--gc-text-primary); text-decoration: underline; }

.gc-disclosure-panel {
  margin-top: 8px;
  padding: 12px 14px;
  background: var(--gc-bg-input);

/* ---------- Phone prefix select (form-level, syncs with address country) ---------- */
function PhonePrefixSelect({ country, onCountryChange }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  const current = COUNTRY_BY_CODE[country] || COUNTRY_BY_CODE['US'];

  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDocClick);
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('mousedown', onDocClick);
      document.removeEventListener('keydown', onKey);
    };
  }, [open]);

  return (
    <div className="gc-phone-prefix-wrap" ref={wrapRef}>
      <button type="button" className={`gc-phone-prefix-trigger ${open ? 'open' : ''}`} onClick={() => setOpen(o => !o)} aria-haspopup="listbox" aria-expanded={open} aria-label={`Phone country: ${current.name} ${current.dial}`}>

              key={c.code}
              type="button"
              className={`gc-phone-prefix-option ${c.code === country ? 'selected' : ''}`}

              <span className="gc-phone-prefix-option-name">{c.name}</span>

/* ---------- Country selector ---------- */
function CountrySelector({ country, onChange }) {
  const [open, setOpen] = useState(false);

  const current = COUNTRIES.find(c => c.code === country) || COUNTRIES[0];

  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => {

/* ---------- Modal component ---------- */
function Modal({ open, title, onClose, children }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="gc-modal-backdrop" onClick={onClose} role="dialog" aria-modal="true" aria-label={title}>
      <div className="gc-modal" onClick={(e) => e.stopPropagation()}>
        <div className="gc-modal-header">
          <div className="gc-modal-title">{title}</div>
          <button className="gc-modal-close" onClick={onClose} aria-label="Close"><IconClose size={18} /></button>
        </div>
        <div className="gc-modal-body">{children}</div>
      </div>
    </div>
  );
}

/* ---------- Helpers ---------- */
function formatPhone(raw) {
  const digits = (raw || '').replace(/\D/g, '').slice(0, 10);
  if (digits.length === 0) return '';
  if (digits.length < 4) return `(${digits}`;
  if (digits.length < 7) return `(${digits.slice(0,3)}) ${digits.slice(3)}`;
  return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
}
function isPhoneComplete(formatted) {
  return (formatted || '').replace(/\D/g, '').length === 10;
}

      })}

/* ---------- Order Summary side panel ---------- */
function OrderSummary({ selection }) {
  const { futures, stocks, stocksLevel } = selection;

  const planName = useMemo(() => {
    const stocksLabel = stocksLevel === STOCKS_L23 ? 'US Stocks (Level 2 & 3)' : 'US Stocks (Level 1)';
    if (futures && stocks) return `CME Futures + ${stocksLabel}`;
    if (futures) return 'CME Futures Package';
    if (stocks) return stocksLabel;
    return 'No plan selected';
  }, [futures, stocks, stocksLevel]);

  const monthly = useMemo(() => {
    let total = 0;
    if (futures) total += PRICES[PLAN_FUTURES];
    if (stocks) total += PRICES[PLAN_STOCKS][stocksLevel];
    return total;
  }, [futures, stocks, stocksLevel]);

  // Included items map verbatim to gocharting.com/pricing product descriptions
  const included = useMemo(() => {
    const out = [];
    if (futures) {
      out.push('Real-time CME exchange data — /ES, /MES, /NQ, /6B, /6E');
      out.push('Footprint & Imbalance Charts');
      out.push('Tick-based Market & Volume Profile');
      out.push('Time & Sales · Level 2/3 DOM');
    }
    if (stocks) {
      if (stocksLevel === STOCKS_L23) {
        out.push('Real-time NASDAQ & NYSE data — Level 2 & 3');
      } else {
        out.push('Real-time NASDAQ & NYSE data — Level 1');
      }
      out.push('Chart Trading · Watchlist Trading');
      out.push('Power Trades · Time & Sales');
    }
    return out;
  }, [futures, stocks, stocksLevel]);

  const selectionKey = `${futures}-${stocks}-${stocksLevel}`;

  return (
    <aside className="gc-summary" aria-label="Order summary">
      <div className="gc-eyebrow gc-summary-eyebrow">Your plan</div>
      <div className="gc-summary-dynamic" key={selectionKey}>
        <div className="gc-summary-name">{planName}</div>

        <div className="gc-summary-price-block">
          <div className="gc-summary-trial-label">Free for 7 days</div>

function StepVerify({ form, setForm, onNext, onBack }) {

  useEffect(() => { firstNameRef.current?.focus(); }, []);

  const isUS = form.country === 'US';
  const requiredFields = ['firstName', 'lastName', 'phone', 'address1', 'city', 'state', 'zip'];
  const phoneOK = isPhoneComplete(form.phone);
  const zipOK = isUS
    ? /^\d{5}(-\d{4})?$/.test((form.zip || '').trim())
    : !!(form.zip || '').trim();
  const allFilled = requiredFields.every(f => {
    if (f === 'phone') return phoneOK;
    if (f === 'zip') return zipOK;
    return !!(form[f] || '').trim();
  });
  const canContinue = allFilled && form.nonProfessional;

  const onField = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));
  const onPhone = (e) => setForm(f => ({ ...f, phone: formatPhone(e.target.value) }));
  const onZip = (e) => {
    const cleaned = isUS
      ? e.target.value.replace(/[^\d-]/g, '').slice(0, 10)
      : e.target.value.slice(0, 12);
    setForm(f => ({ ...f, zip: cleaned }));

  const handleContinue = () => {
    if (!canContinue) { setShowErrors(true); return; }
    if (submitting) return;
    setSubmitting(true);
    setTimeout(() => { setSubmitting(false); onNext(); }, SUBMIT_DELAY_MS);

    return !(form[k] || '').trim();

function OtpSubStep({ onComplete, onBackToPhone }) {
  const [digits, setDigits] = useState(['', '', '', '', '', '']);
  const [countdown, setCountdown] = useState(56);
  const [verifyState, setVerifyState] = useState('idle'); // idle | verifying | error
  const inputs = useRef([]);

  useEffect(() => {
    if (inputs.current[0]) inputs.current[0].focus();
  }, []);

  useEffect(() => {
    if (countdown <= 0) return;
    const t = setTimeout(() => setCountdown(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [countdown]);

  useEffect(() => {
    if (digits.every(d => d !== '') && verifyState === 'idle') {
      const code = digits.join('');
      setVerifyState('verifying');
      const id = setTimeout(() => {
        if (code === OTP_TEST_INVALID_CODE) {
          setVerifyState('error');
          setTimeout(() => {
            setDigits(['', '', '', '', '', '']);
            setVerifyState('idle');
            inputs.current[0]?.focus();
          }, 1400);
        } else {
          onComplete();
        }
      }, 700);
      return () => clearTimeout(id);
    }
  }, [digits, onComplete, verifyState]);

  const handleChange = (i, val) => {
    if (verifyState !== 'idle') return;
    const v = val.replace(/\D/g, '').slice(-1);
    const next = [...digits];
    next[i] = v;
    setDigits(next);
    if (v && i < 5) inputs.current[i + 1]?.focus();
  };

  const handleKey = (i, e) => {
    if (e.key === 'Backspace' && !digits[i] && i > 0) {
      inputs.current[i - 1]?.focus();
      const next = [...digits];
      next[i - 1] = '';
      setDigits(next);
    }
    if (e.key === 'ArrowLeft' && i > 0) inputs.current[i - 1]?.focus();
    if (e.key === 'ArrowRight' && i < 5) inputs.current[i + 1]?.focus();
  };

  const handlePaste = (e) => {
    const text = (e.clipboardData || window.clipboardData).getData('text');
    const clean = text.replace(/\D/g, '').slice(0, 6);
    if (!clean) return;
    e.preventDefault();
    const next = ['', '', '', '', '', ''];
    for (let i = 0; i < clean.length; i++) next[i] = clean[i];
    setDigits(next);
    const focusIdx = Math.min(clean.length, 5);
    inputs.current[focusIdx]?.focus();
  };

  const handleResend = () => {
    setDigits(['', '', '', '', '', '']);
    setCountdown(56);
    setVerifyState('idle');
    inputs.current[0]?.focus();
  };

  const boxClass = (d) => {
    if (verifyState === 'error') return 'gc-otp-box error';
    if (d) return 'gc-otp-box filled';
    return 'gc-otp-box';
  };

  return (
    <>
      <button className="gc-back-link" onClick={onBackToPhone} disabled={verifyState !== 'idle'}>
        <IconArrowLeft size={12} /> Back to phone entry
      </button>

      <div className={`gc-otp-row ${verifyState === 'error' ? 'shake' : ''}`}>
        {digits.map((d, i) => (
          <input
            key={i}
            ref={(el) => (inputs.current[i] = el)}
            className={boxClass(d)}
            value={d}
            onChange={(e) => handleChange(i, e.target.value)}
            onKeyDown={(e) => handleKey(i, e)}
            onPaste={i === 0 ? handlePaste : undefined}
            inputMode="numeric"
            maxLength={1}
            disabled={verifyState !== 'idle'}
            aria-label={`Digit ${i + 1}`}
          />
        ))}
      </div>

      {verifyState === 'verifying' && (
        <div className="gc-otp-status verifying"><IconSpinner size={14} /> Verifying code…</div>
      )}
      {verifyState === 'error' && (
        <div className="gc-otp-status error"><IconAlert size={14} /> Invalid code. Try again.</div>
      )}
      {verifyState === 'idle' && (
        <div className="gc-otp-resend">
          Didn't receive the code?{' '}
          {countdown > 0 ? (
            <>Resend in <span className="gc-mono">0:{countdown.toString().padStart(2, '0')}</span></>
          ) : (
            <a href="#" onClick={(e) => { e.preventDefault(); handleResend(); }}>Resend code</a>
          )}
        </div>
      )}
      {typeof window !== 'undefined' && window.location.hash === '#demo' && verifyState === 'idle' && (
        <div className="gc-otp-test-hint">Demo: any 6 digits succeed · enter <span className="gc-mono">{OTP_TEST_INVALID_CODE}</span> to see the error state</div>
      )}
    </>
  );
}

/* ---------- Step 4: Trial activated ---------- */
function StepTrial({ onOpenApp, onReset, monthlyPrice, planName }) {
  const [opening, setOpening] = useState(false);
  const today = useMemo(() => new Date(), []);
  const dates = useMemo(() => ({
    today,
    day7: addDays(today, 7),
    day8: addDays(today, 8),
    day22: addDays(today, 22),
  }), [today]);

  const handleOpen = () => {
    if (opening) return;
    setOpening(true);
    setTimeout(() => onOpenApp(), 900);
  };

  return (
    <div className="gc-step-content">
      <Timeline stepIndex={3} />
      <div className="gc-success-wrap">
        <div className="gc-success-icon">
          <svg className="gc-success-check" viewBox="0 0 24 24">
            <path d="M5 12.5l5 5L20 7" />
          </svg>
        </div>
        <h1 className="gc-success-h1">You're in. Trial starts now.</h1>
        <p className="gc-success-body">
          <span className="gc-success-plan">{planName}</span> · Free until <span className="gc-mono">{fmtShortDate(dates.day7)}</span>. We'll email you 24 hours before your subscription begins. Cancel anytime, no questions asked.
        </p>

        <div className="gc-timeline-card">
          <div className="gc-tl-row done">
            <div className="gc-tl-left">
              <div className="gc-tl-icon done"><IconCheck size={14} /></div>
              <div>
                <div className="gc-tl-label">You're here</div>
                <div className="gc-tl-meta">Trial active · all features unlocked</div>
              </div>
            </div>
            <div className="gc-tl-date">Today · <span className="gc-mono">{fmtShortDate(dates.today)}</span></div>
          </div>
          <div className="gc-tl-row">
            <div className="gc-tl-left">
              <div className="gc-tl-icon pending">7</div>
              <div>
                <div className="gc-tl-label">Reminder email</div>
                <div className="gc-tl-meta">24 hours before subscription begins</div>
              </div>
            </div>
            <div className="gc-tl-date">Day 7 · <span className="gc-mono">{fmtShortDate(dates.day7)}</span></div>
          </div>
          <div className="gc-tl-row">
            <div className="gc-tl-left">
              <div className="gc-tl-icon pending">8</div>
              <div>
                <div className="gc-tl-label">Subscription begins</div>
                <div className="gc-tl-meta"><span className="gc-mono">${monthlyPrice.toFixed(2)}/month</span> if not canceled</div>
              </div>
            </div>
            <div className="gc-tl-date">Day 8 · <span className="gc-mono">{fmtShortDate(dates.day8)}</span></div>
          </div>
          <div className="gc-tl-row">
            <div className="gc-tl-left">
              <div className="gc-tl-icon pending">↺</div>
              <div>
                <div className="gc-tl-label">Refund window closes</div>
                <div className="gc-tl-meta">Full refund within 14 days of first charge</div>
              </div>
            </div>
            <div className="gc-tl-date">Day 22 · <span className="gc-mono">{fmtShortDate(dates.day22)}</span></div>
          </div>
        </div>

        <button className="gc-cta-primary" onClick={handleOpen} disabled={opening}>
          {opening ? <><IconSpinner size={16} /> Opening GoCharting…</> : <>Open GoCharting <IconArrowRight size={16} /></>}
        </button>

        <a href="#" className="gc-manage-link" onClick={(e) => e.preventDefault()}>
          Manage subscription
        </a>

        {typeof window !== 'undefined' && window.location.hash === '#demo' && (
          <div style={{ marginTop: 8 }}>
            <a href="#demo" className="gc-manage-link" onClick={(e) => { e.preventDefault(); onReset(); }}>
              Restart demo from Step 1
            </a>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- International notice (non-US users) ---------- */
function InternationalNotice({ country, onSwitchToUS }) {
  const c = COUNTRIES.find(x => x.code === country) || COUNTRIES[0];
  const isIndia = country === 'IN';
  return (
    <div className="gc-intl-notice">
      <div className="gc-intl-flag" aria-hidden="true">{c.flag}</div>
      <div className="gc-eyebrow gc-step-eyebrow" style={{ marginBottom: 8 }}>
        {isIndia ? 'India · coming Q3' : 'International · coming soon'}
      </div>
      <h2 className="gc-step-h2" style={{ marginBottom: 12 }}>
        {isIndia
          ? 'GoCharting for India is launching soon.'
          : 'We\'re expanding outside the US shortly.'}
      </h2>
      <p className="gc-step-subtitle" style={{ maxWidth: 520, marginInline: 'auto' }}>
        {isIndia
          ? 'NSE and BSE real-time data plans will be available with Razorpay billing. Join the waitlist and we\'ll email when your market goes live.'
          : 'Exchange-by-exchange real-time data plans for European, APAC, and other markets are in regulatory review. Join the waitlist to be notified.'}
      </p>
      <div className="gc-intl-actions">
        <button className="gc-cta-primary gc-intl-cta" onClick={(e) => e.preventDefault()}>
          Join the {c.name} waitlist <IconArrowRight size={16} />
        </button>
        <button className="gc-cta-ghost gc-intl-ghost" onClick={onSwitchToUS}>
          Switch to US flow
        </button>
      </div>
      <div className="gc-intl-meta">
        Trading from the US? <a href="#" onClick={(e) => { e.preventDefault(); onSwitchToUS(); }}>Switch to United States</a> to continue.
      </div>
    </div>
  );
}

/* ---------- Root App ---------- */
function App() {
  const [step, setStep] = useState(0);
  const [appOpened, setAppOpened] = useState(false);
  const [summaryOpen, setSummaryOpen] = useState(false); // mobile collapsed bar state
  const [country, setCountry] = useState('US'); // 'US' | 'IN' | 'ROW'

  const [selection, setSelection] = useState({
    futures: true,           // CME Futures Package selected
    stocks: false,           // US Stocks selected
    stocksLevel: STOCKS_L1,  // US Stocks Level 1 by default
  });

  const [form, setForm] = useState({
    firstName: '',
    lastName: '',
    phone: '',
    address1: '',
    city: '',
    state: '',
    zip: '',
    country: 'US',
    nonProfessional: false,
    smsConsent: false,
    retentionAck: false,
  });

  const monthlyPrice = useMemo(() => {
    let total = 0;
    if (selection.futures) total += PRICES[PLAN_FUTURES];
    if (selection.stocks) total += PRICES[PLAN_STOCKS][selection.stocksLevel];
    return total;
  }, [selection]);

  const planName = useMemo(() => {
    const { futures, stocks, stocksLevel } = selection;
    const stocksLabel = stocksLevel === STOCKS_L23 ? 'US Stocks (Level 2 & 3)' : 'US Stocks (Level 1)';
    if (futures && stocks) return `CME Futures + ${stocksLabel}`;
    if (futures) return 'CME Futures Package';
    if (stocks) return stocksLabel;
    return 'GoCharting Trial';
  }, [selection]);

  const next = () => setStep(s => Math.min(s + 1, 3));
  const back = () => setStep(s => Math.max(s - 1, 0));
  const reset = () => {
    setStep(0);
    setAppOpened(false);
    setForm({
      firstName: '', lastName: '', phone: '', address1: '',
      city: '', state: '', zip: '', country: 'US',
      nonProfessional: false, smsConsent: false, retentionAck: false,
    });
    setSelection({ futures: true, stocks: false, stocksLevel: STOCKS_L1 });
  };

  // Scroll to top on step change
  useEffect(() => {
    if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });
    setSummaryOpen(false);
  }, [step]);

  const showSummary = step < 3;

  if (appOpened) {
    return (
      <>
        <TopNav country={country} onCountryChange={setCountry} />
        <div className="gc-app-stub">
          <IconLogo size={48} />
          <h2 className="gc-step-h2" style={{ marginTop: 24 }}>Welcome to GoCharting.</h2>
          <p className="gc-step-subtitle" style={{ maxWidth: 480, textAlign: 'center', marginTop: 8 }}>
            In production, this would load your trading workspace. For the prototype, this is where the flow ends.
          </p>
          <button className="gc-cta-ghost" style={{ marginTop: 32 }} onClick={reset}>
            <IconArrowLeft size={14} /> Back to Step 1
          </button>
        </div>
      </>
    );
  }

  if (country !== 'US') {
    return (
      <>
        <TopNav country={country} onCountryChange={setCountry} />
        <div className="gc-container">
          <InternationalNotice country={country} onSwitchToUS={() => setCountry('US')} />
        </div>
      </>
    );
  }

  return (
    <>
      <TopNav country={country} onCountryChange={setCountry} />
      <div className="gc-container">
        {showSummary ? (
          <>
            <MobileSummaryBar
              selection={selection}
              monthlyPrice={monthlyPrice}
              planName={planName}
              open={summaryOpen}
              onToggle={() => setSummaryOpen(o => !o)}
            />
            <div className="gc-grid">
              <OrderSummary selection={selection} />
              <div className="gc-step-area">
                {step === 0 && <StepPlan key="s0" selection={selection} setSelection={setSelection} onNext={next} />}
                {step === 1 && <StepVerify key="s1" form={form} setForm={setForm} onNext={next} onBack={back} />}
                {step === 2 && <StepConfirm key="s2" form={form} setForm={setForm} onNext={next} onBack={back} />}
              </div>
            </div>
          </>
        ) : (
          <div className="gc-step-area">
            <StepTrial
              onOpenApp={() => setAppOpened(true)}
              onReset={reset}
              monthlyPrice={monthlyPrice}
              planName={planName}
            />
          </div>
        )}
      </div>
    </>
  );
}

/* ---------- Mobile compact summary bar ---------- */
function MobileSummaryBar({ selection, monthlyPrice, planName, open, onToggle }) {
  return (
    <div className={`gc-mobile-summary ${open ? 'expanded' : ''}`}>
      <button className="gc-mobile-summary-toggle" onClick={onToggle} aria-expanded={open}>
        <div className="gc-mobile-summary-info">
          <div className="gc-mobile-summary-plan">{planName}</div>
          <div className="gc-mobile-summary-price">
            <span className="gc-mono">$0</span> today · then <span className="gc-mono">${monthlyPrice.toFixed(2)}/mo</span>
          </div>
        </div>
        <span className={`gc-mobile-summary-chevron ${open ? 'open' : ''}`}>
          <IconChevronDown size={16} />
        </span>
      </button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
